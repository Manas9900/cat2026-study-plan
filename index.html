<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT 2026 Final Sprint — 40 Days to Domination</title>
  <meta name="description" content="Interactive CAT 2026 preparation schedule and tracker for the final 40 days">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1>CAT 2026 <span class="accent">Final Sprint</span> <span style="font-size:.9rem;color:var(--amber);vertical-align:super">40-Day Plan</span></h1>
      <p class="subtitle">IIM Rohtak → Top IIMs & FMS · 25+ Mocks · 45+ Sectionals · QA Short Notes · Oct 20 – Nov 29</p>
      <div class="countdown" id="countdown"></div>
      <div class="stats-bar">
        <div class="stat"><span class="stat-num" id="stat-days">—</span><span class="stat-label">Days Left</span></div>
        <div class="stat"><span class="stat-num" id="stat-mocks">25</span><span class="stat-label">Full Mocks</span></div>
        <div class="stat"><span class="stat-num" id="stat-sectionals">46</span><span class="stat-label">Sectionals</span></div>
        <div class="stat"><span class="stat-num" id="stat-sn">16</span><span class="stat-label">QA Short Notes</span></div>
        <div class="stat"><span class="stat-num">85+</span><span class="stat-label">Target %ile</span></div>
        <div class="stat"><span class="stat-num">IIM A/B/C/FMS</span><span class="stat-label">Mission</span></div>
      </div>
    </div>
  </header>

  <nav class="tab-nav" id="tabNav">
    <button class="tab active" data-tab="weekly">Sprint & Midterm Plan</button>
    <button class="tab" data-tab="mocks">25 Mocks Calendar</button>
    <button class="tab" data-tab="qa">45+ Sectionals</button>
    <button class="tab" data-tab="lrdi">QA Short Notes</button>
    <button class="tab" data-tab="varc">LR & VARC Boosters</button>
    <button class="tab" data-tab="milestones">Milestones</button>
  </nav>

  <main class="content">
    <section id="weekly" class="tab-panel active"></section>
    <section id="mocks" class="tab-panel"></section>
    <section id="qa" class="tab-panel"></section>
    <section id="lrdi" class="tab-panel"></section>
    <section id="varc" class="tab-panel"></section>
    <section id="milestones" class="tab-panel"></section>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
